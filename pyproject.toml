[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalpy-gui"
version = "0.1.0"
description = "A PySide6 desktop app to detect, classify and segment ultrasonic vocalizations (gumadeiras/vocalpy) and export per-file CSVs"
readme = "README.md"
requires-python = ">=3.12"
# NOTE: the detection engine (gumadeiras/vocalpy) is vendored under ./vocalpy and
# installed editable (`pip install -e ./vocalpy`); it is intentionally NOT listed
# here so pip never pulls the unrelated PyPI package named "vocalpy".
dependencies = [
    "PySide6>=6.7",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "soundfile>=0.12",
    "scipy>=1.11",
]

[project.scripts]
vocalpy-gui = "vpgui.app:main"
vocalpy-cli = "vpgui.cli:main"

[tool.setuptools]
packages = ["vpgui"]
